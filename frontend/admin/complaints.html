<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Private complaint management view for authorized GPB-Resolve administrators." />
    <meta name="robots" content="noindex,nofollow" />
    <title>Complaints | GPB-Resolve</title>
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body data-page="admin-complaints" data-required-role="admin">
    <header class="topbar">
      <div class="container topbar-inner">
        <a class="brand" data-path="frontend/index.html"
          ><span class="brand-mark">G</span><span>GPB-Resolve</span></a
        >
        <nav>
          <ul>
            <li><a data-path="frontend/admin/dashboard.html">Dashboard</a></li>
            <li>
              <a data-path="frontend/admin/complaints.html">Complaints</a>
            </li>
            <li>
              <a data-path="frontend/admin/categories.html">Categories</a>
            </li>
            <li>
              <a data-path="frontend/admin/departments.html">Departments</a>
            </li>
            <li><a data-path="frontend/admin/users.html">Users</a></li>
            <li><a data-logout>Logout</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <main class="container" style="padding-top: 2rem">
      <p><a class="btn btn-outline" data-path="frontend/admin/dashboard.html">← Back to dashboard</a></p>
      <h1>Manage complaints</h1>
      <form id="complaint-filters" class="form-grid">
        <div>
          <label for="filter-status">Status</label
          ><select id="filter-status" name="status">
            <option value="">All statuses</option>
            <option>Submitted</option>
            <option>Under Review</option>
            <option>Assigned</option>
            <option>In Progress</option>
            <option>Resolved</option>
            <option>Rejected</option>
          </select>
        </div>
        <div>
          <label for="filter-priority">Priority</label
          ><select id="filter-priority" name="priority">
            <option value="">All priorities</option>
            <option>Low</option>
            <option>Medium</option>
            <option>High</option>
            <option>Urgent</option>
          </select>
        </div>
        <button class="btn btn-secondary" type="submit">Filter</button>
      </form>
      <div id="admin-complaints-content"></div>
    </main>
    <script src="../assets/js/app.js" defer></script>
  </body>
</html>
